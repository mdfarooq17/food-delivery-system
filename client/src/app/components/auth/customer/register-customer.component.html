<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Join FoodFlow and enjoy the best food in town</p>
    </div>

    <form (submit)="register()" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" [(ngModel)]="name" name="name" placeholder="John Doe" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" [(ngModel)]="email" name="email" placeholder="john@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Select City</label>
        <div class="input-wrapper">
          <i class="fas fa-map-marker-alt"></i>
          <select [(ngModel)]="city" name="city" required>
            <option value="" disabled>Choose city</option>
            <option *ngFor="let c of cities" [value]="c.name">{{ c.name }}</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Date of Birth</label>
        <div class="input-wrapper">
          <i class="fas fa-calendar-alt"></i>
          <input type="date" [(ngModel)]="dateOfBirth" name="dateOfBirth" required>
        </div>
      </div>

      <div class="form-group">
        <label>Security Question</label>
        <div class="input-wrapper">
          <i class="fas fa-question-circle"></i>
          <select [(ngModel)]="securityQuestion" name="securityQuestion" required>
            <option value="" disabled>Select a security question</option>
            <option *ngFor="let question of securityQuestions" [value]="question">{{ question }}</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Security Answer</label>
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="password" [(ngModel)]="securityAnswer" name="securityAnswer" placeholder="Your answer" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrapper">
          <i class="fas fa-shield-alt"></i>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
        </div>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
      <div class="success-alert" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button type="submit" class="btn-auth" [disabled]="isLoading">
        {{ isLoading ? 'Creating...' : 'Sign Up' }}
      </button>

      <div class="auth-footer">
        Already have an account? <a routerLink="/login/customer">Login here</a>
      </div>
    </form>
  </div>
</div>
