<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Customer Login</h2>
      <p>Welcome back! Sign in to order your favorite food.</p>
    </div>

    <form (submit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" [(ngModel)]="loginData.email" name="email" placeholder="john@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" [(ngModel)]="loginData.password" name="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-auth" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Sign In' }}
      </button>

      <div class="auth-footer">
        Don't have an account? <a routerLink="/register">Sign Up</a>
        <div class="other-logins" style="margin-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem;">
          <p style="font-size: 0.8rem; margin-bottom: 0.5rem;">Partner Portals:</p>
          <div style="display: flex; gap: 10px; justify-content: center; font-size: 0.8rem;">
            <a routerLink="/restaurant" style="color: #00e08f;">Restaurant</a>
            <span style="opacity: 0.2;">|</span>
            <a routerLink="/rider" style="color: #00e08f;">Rider</a>
            <span style="opacity: 0.2;">|</span>
            <a routerLink="/admin" style="color: #00e08f;">Admin</a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
