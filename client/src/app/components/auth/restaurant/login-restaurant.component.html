<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Restaurant Login</h2>
      <p>Manage your menu and orders in real-time</p>
    </div>

    <form (submit)="login()" class="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" [(ngModel)]="email" name="email" placeholder="restaurant@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="forgot-password-link" style="margin-bottom: 1rem; text-align: right;">
        <a href="#" (click)="toggleForgotPassword($event)" style="color: #00e08f; font-size: 0.9rem;">Forgot Password?</a>
      </div>

      <div *ngIf="showForgotPassword" class="forgot-password-panel" style="margin-bottom: 1.5rem; padding: 1rem; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; background: rgba(0,0,0,0.15);">
        <div class="form-group">
          <label>Reset Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" [(ngModel)]="resetEmail" name="resetEmail" placeholder="restaurant@example.com" required>
          </div>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" [(ngModel)]="resetPassword" name="resetPassword" placeholder="••••••••" required>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <i class="fas fa-shield-alt"></i>
            <input type="password" [(ngModel)]="resetConfirmPassword" name="resetConfirmPassword" placeholder="••••••••" required>
          </div>
        </div>
        <div class="error-alert" *ngIf="resetError" style="margin-bottom: 0.75rem;">
          {{ resetError }}
        </div>
        <div class="success-alert" *ngIf="resetMessage" style="margin-bottom: 0.75rem;">
          {{ resetMessage }}
        </div>
        <button type="button" class="btn-auth" [disabled]="isResetLoading" (click)="requestPasswordReset()">
          {{ isResetLoading ? 'Submitting...' : 'Request Password Reset' }}
        </button>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-auth" [disabled]="isLoading">
        {{ isLoading ? 'Authenticating...' : 'Sign In as Restaurant' }}
      </button>

      <div class="auth-footer">
        New Partner? <a routerLink="/register/restaurant">Join FoodFlow</a>
        <div class="back-link" style="margin-top: 1rem;">
          <a routerLink="/login" style="font-size: 0.8rem; opacity: 0.6;">← General Login</a>
        </div>
      </div>
    </form>
  </div>
</div>
