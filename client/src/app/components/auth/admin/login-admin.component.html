<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Admin Control</h2>
      <p>Secure access for platform administrators</p>
    </div>

    <form (submit)="login()" class="auth-form">
      <div class="form-group">
        <label>Admin ID / Email</label>
        <div class="input-wrapper">
          <i class="fas fa-user-shield"></i>
          <input type="email" [(ngModel)]="email" name="email" placeholder="admin@foodflow.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Secret Password</label>
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
        </div>
      </div>
      <div class="forgot-password-link" style="margin-bottom: 1rem; text-align: right;">
        <a href="#" (click)="toggleForgotPassword($event)" style="color: #00e08f; font-size: 0.9rem;">Forgot Password?</a>
      </div>

      <div *ngIf="showForgotPassword" class="forgot-password-panel" style="margin-bottom: 1.5rem; padding: 1rem; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; background: rgba(0,0,0,0.15);">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" [(ngModel)]="resetEmail" name="resetEmail" placeholder="john@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label>Registered Name</label>
          <div class="input-wrapper">
            <i class="fas fa-user-shield"></i>
            <input type="text" [(ngModel)]="resetName" name="resetName" placeholder="Admin Name" required>
          </div>
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <div class="input-wrapper">
            <i class="fas fa-calendar-alt"></i>
            <input type="date" [(ngModel)]="resetDob" name="resetDob" required>
          </div>
        </div>

        <div class="form-group">
          <label>Security Question</label>
          <div class="input-wrapper">
            <i class="fas fa-question-circle"></i>
            <select [(ngModel)]="resetSecurityQuestion" name="resetSecurityQuestion" required>
              <option value="" disabled selected>Select a question</option>
              <option *ngFor="let question of securityQuestions" [value]="question">{{ question }}</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Security Answer</label>
          <div class="input-wrapper">
            <i class="fas fa-key"></i>
            <input type="password" [(ngModel)]="resetSecurityAnswer" name="resetSecurityAnswer" placeholder="Enter your answer" required>
          </div>
        </div>

        <div class="form-group">
          <label>New Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="••••••••" required>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <i class="fas fa-shield-alt"></i>
            <input type="password" [(ngModel)]="resetConfirmPassword" name="resetConfirmPassword" placeholder="••••••••" required>
          </div>
        </div>

        <div class="error-alert" *ngIf="resetError" style="margin-bottom: 0.75rem;">
          {{ resetError }}
        </div>
        <div class="success-alert" *ngIf="resetMessage" style="margin-bottom: 0.75rem; white-space: pre-line;">
          {{ resetMessage }}
        </div>

        <button type="button" class="btn-auth" [disabled]="isResetLoading" (click)="resetPassword()">
          {{ isResetLoading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </div>
      <div class="error-alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-auth" [disabled]="isLoading" style="background: #2c3e50; color: white;">
        {{ isLoading ? 'Verifying...' : 'Authorize Access' }}
      </button>

      <div class="auth-footer">
        <div class="back-link">
          <a routerLink="/login" style="font-size: 0.8rem; opacity: 0.6;">← General Login</a>
        </div>
      </div>
    </form>
  </div>
</div>
