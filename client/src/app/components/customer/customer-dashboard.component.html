<div class="customer-dashboard">
  <!-- Header -->
  <header class="main-header">
    <div class="header-top">
      <div class="auth-links" *ngIf="!isLoggedIn">
        <a href="/login/customer" class="login-btn">Login</a>
        <a href="/register/customer" class="register-btn">Register</a>
      </div>
    </div>
    <div class="header-main">
      <div class="logo">FoodPanda</div>
      <div class="location-cart">
        <div class="location">
          <i class="fas fa-map-marker-alt"></i>
          <span>{{ selectedAddress || 'Select Address' }}</span>
          <button class="change-address">Change</button>
        </div>
        <div class="header-actions">
          <button class="action-btn"><i class="fas fa-heart"></i> Favorites</button>
          <button class="action-btn cart-btn">
            <i class="fas fa-shopping-cart"></i> Cart ({{ cartCount }})
          </button>
          <button class="action-btn" *ngIf="isLoggedIn"><i class="fas fa-user"></i> Profile</button>
          <button class="theme-toggle" (click)="toggleTheme()">
            <i [class]="isDarkTheme ? 'fas fa-sun' : 'fas fa-moon'"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="header-bottom">
      <div class="search-filters">
        <div class="search-bar">
          <input type="text" placeholder="Search for restaurants, cuisines, or dishes..." class="search-input">
          <button class="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <div class="filters">
          <button class="filter-btn active">All</button>
          <button class="filter-btn">Rating 4.0+</button>
          <button class="filter-btn">Fast Delivery</button>
          <button class="filter-btn">Offers</button>
        </div>
      </div>
      <div class="user-actions">
        <button class="action-link">My Orders</button>
        <button class="action-link">Track My Order</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <app-image-slider></app-image-slider>
    <app-top-brands></app-top-brands>
    <app-categories></app-categories>
    <app-product-cards></app-product-cards>

    <!-- Banner Section -->
    <section class="banner-section">
      <div class="banner-card">
        <div class="banner-content">
          <h2>Special Offers</h2>
          <p>Discover amazing deals on your favorite foods</p>
          <button class="learn-more-btn">Learn More</button>
        </div>
        <div class="banner-image">
          <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ca4b?w=400" alt="Banner">
        </div>
      </div>
    </section>

    <!-- Top Selling Section -->
    <section class="top-selling-section">
      <h2>Top Selling Items</h2>
      <div class="top-selling-grid">
        <!-- Similar to product cards but for top selling -->
      </div>
      <div class="newsletter">
        <h3>Get 25% Discount on First Order</h3>
        <div class="newsletter-form">
          <input type="email" placeholder="Enter your email" class="email-input">
          <button class="subscribe-btn">Subscribe</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="footer-content">
      <div class="footer-section">
        <h4>Customer</h4>
        <a href="/login/customer">Login</a>
        <a href="/register/customer">Register</a>
      </div>
      <div class="footer-section">
        <h4>Restaurant</h4>
        <a href="/login/restaurant">Restaurant Login</a>
      </div>
      <div class="footer-section">
        <h4>Support</h4>
        <a href="#">Help Center</a>
        <a href="#">Contact Us</a>
      </div>
    </div>
  </footer>
</div>
