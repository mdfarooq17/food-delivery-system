<div class="profile-container">
  <div class="profile-header">
    <h2>My Profile</h2>
    <button class="btn-back" (click)="goBack()">← Back to Dashboard</button>
  </div>

  <div class="profile-content" *ngIf="!isLoading">
    <!-- Profile Information -->
    <div class="profile-section">
      <div class="section-header">
        <h3>Profile Information</h3>
        <button class="btn-edit" (click)="toggleEdit()" *ngIf="!isEditing">
          <i class="fas fa-edit"></i> Edit
        </button>
      </div>

      <div class="profile-form" *ngIf="isEditing; else viewMode">
        <form (ngSubmit)="updateProfile()">
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" [(ngModel)]="profileData.name" name="name" required>
          </div>

          <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" [(ngModel)]="profileData.address" name="address" rows="3"
                      placeholder="Enter your delivery address"></textarea>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" [(ngModel)]="profileData.phone" name="phone"
                   placeholder="e.g. +1-234-567-8900">
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-save" [disabled]="isLoading">
              {{ isLoading ? 'Saving...' : 'Save Changes' }}
            </button>
            <button type="button" class="btn-cancel" (click)="toggleEdit()">Cancel</button>
          </div>
        </form>
      </div>

      <ng-template #viewMode>
        <div class="profile-info">
          <div class="info-item">
            <label>Name:</label>
            <span>{{ user?.name || 'Not set' }}</span>
          </div>
          <div class="info-item">
            <label>Email:</label>
            <span>{{ user?.email }}</span>
          </div>
          <div class="info-item">
            <label>Role:</label>
            <span class="role-badge" [ngClass]="user?.role">{{ user?.role | titlecase }}</span>
          </div>
          <div class="info-item">
            <label>Address:</label>
            <span>{{ user?.address || 'Not set' }}</span>
          </div>
          <div class="info-item">
            <label>Phone:</label>
            <span>{{ user?.phone || 'Not set' }}</span>
          </div>
        </div>
      </ng-template>
    </div>

    <!-- Password Change Section -->
    <div class="profile-section">
      <div class="section-header">
        <h3>Security</h3>
        <button class="btn-edit" (click)="togglePasswordChange()" *ngIf="!showPasswordChange">
          <i class="fas fa-key"></i> Change Password
        </button>
      </div>

      <div class="password-form" *ngIf="showPasswordChange">
        <form (ngSubmit)="changePassword()">
          <div class="form-group">
            <label for="currentPassword">Current Password *</label>
            <input type="password" id="currentPassword" [(ngModel)]="passwordData.currentPassword"
                   name="currentPassword" required>
          </div>

          <div class="form-group">
            <label for="newPassword">New Password *</label>
            <input type="password" id="newPassword" [(ngModel)]="passwordData.newPassword"
                   name="newPassword" required minlength="6">
            <small class="form-hint">Must be at least 6 characters long</small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm New Password *</label>
            <input type="password" id="confirmPassword" [(ngModel)]="passwordData.confirmPassword"
                   name="confirmPassword" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-save" [disabled]="isLoading">
              {{ isLoading ? 'Changing...' : 'Change Password' }}
            </button>
            <button type="button" class="btn-cancel" (click)="togglePasswordChange()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="loading" *ngIf="isLoading">
    <div class="spinner"></div>
    <p>Loading profile...</p>
  </div>
</div>
