<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Customer Login</h2>
      <p>Welcome back! Please sign in to your account.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="loginData.email"
          name="email"
          required
          placeholder="Enter your email"
          class="form-input">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="loginData.password"
          name="password"
          required
          placeholder="Enter your password"
          class="form-input">
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe">
          Remember me
        </label>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn" [disabled]="isLoading">
        <span *ngIf="isLoading">Signing In...</span>
        <span *ngIf="!isLoading">Sign In</span>
      </button>
    </form>

    <div class="login-footer">
      <p>Don't have an account? <a href="/register/customer" class="register-link">Register here</a></p>
      <div class="other-logins">
        <p>Login as:</p>
        <a href="/login/restaurant" class="other-login-link">Restaurant</a> |
        <a href="/login/admin" class="other-login-link">Admin</a> |
        <a href="/login/rider" class="other-login-link">Rider</a>
      </div>
    </div>
  </div>
</div>
