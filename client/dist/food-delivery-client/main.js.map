<div class="register-container">
  <div class="register-box">
    <div class="header-group">
      <h2>Create Account</h2>
      <p class="subtitle">Join us to order delicious food or manage your restaurant</p>
    </div>
    
    <form (ngSubmit)="register()">
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="name">Full Name</label>
          <input type="text" id="name" [(ngModel)]="name" name="name" placeholder="John Doe" required>
        </div>
        
        <div class="form-group full-width">
          <label for="email">Email Address</label>
          <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Create password" required>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
        </div>
        
        <div class="form-group full-width">
          <label for="role">Register as</label>
          <select id="role" [(ngModel)]="role" name="role">
            <option value="customer">Hungry Customer</option>
            <option value="restaurant">Restaurant Owner</option>
            <option value="rider">Delivery Rider</option>
            <option value="admin">System Admin</option>
          </select>
        </div>
      </div>
      
      <div *ngIf="errorMessage" class="error-message">
        <i class="fas fa-exclamation-triangle"></i> {{ errorMessage }}
      </div>
      
      <div *ngIf="successMessage" class="success-message">
        <i class="fas fa-check-circle"></i> {{ successMessage }}
      </div>
      
      <button type="submit" class="btn" [disabled]="isLoading">
        {{ isLoading ? 'Creating Account...' : 'Create Account' }}
      </button>
    </form>
    
    <p class="footer-text">Already have an account? <a routerLink="/login">Sign In</a></p>
  </div>
</div>
